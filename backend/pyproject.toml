[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "carbon-aware-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3", "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.5,<3", "pandas>=2.2,<3", "numpy>=2,<3", "scipy>=1.14,<2"]
[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.9,<1"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
