services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: carbon
      POSTGRES_USER: carbon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carbon -d carbon"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://carbon:${POSTGRES_PASSWORD}@db:5432/carbon
      BACKTEST_REVIEW_FILE: ${BACKTEST_REVIEW_FILE:-}
      PORTFOLIO_REVIEW_FILE: ${PORTFOLIO_REVIEW_FILE:-}
      ANALYSIS_REVIEW_FILE: ${ANALYSIS_REVIEW_FILE:-}
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
